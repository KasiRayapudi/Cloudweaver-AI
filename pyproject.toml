[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-infra-iac-generator"
version = "1.0.0"
description = "Generate a cloud architecture diagram and matching Terraform from a plain-language requirement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
]

[project.optional-dependencies]
llm = ["anthropic>=0.42"]
dev = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
iacgen = "cli:main"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# str+Enum is deliberate: it keeps the IR JSON-serialisable without custom encoders.
ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
