    <text class="sublabel text-traffic" x="150.0" y="264.0">alb</text>
  </g>
  <g><title>instance_type=t3.medium; min_size=2; max_size=6; desired_capacity=2; subnet_band=private</title>
    <rect class="node fill-compute" x="348.0" y="362.0" width="178.0" height="68.0" rx="10"/>
    <rect class="badge-compute" x="360.0" y="374.0" width="34" height="17" rx="4"/>
